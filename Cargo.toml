[workspace]
resolver = "2"
members = [
    "crates/homecooked-schema",
    "crates/homecooked-protocol",
    "crates/homecooked-core",
    "crates/homecooked-sim",
    "crates/homecooked-wasm",
    "crates/homecooked-io-map",
    "crates/homecooked-interlock",
    "crates/homecooked-hal",
    "crates/homecooked-procedure",
    "crates/homecooked-controller",
    "crates/homecooked-thermal",
    "crates/homecooked-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.70"
repository = "https://github.com/jtwolfe/HomeCooked"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
